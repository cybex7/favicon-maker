[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "favicon-maker"
dynamic = ["version"]
description = "Build a full favicon set and web manifest from one image."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arash Abdous" }]
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "resvg-py>=0.5"]
keywords = ["favicon", "icon", "manifest", "pwa", "apple-touch-icon"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
favicon-maker = "favicon_maker.cli:main"

[project.urls]
Homepage = "https://github.com/cybex7/favicon-maker"

[tool.setuptools.dynamic]
version = { attr = "favicon_maker.__version__" }
